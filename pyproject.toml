[project]
name = "wildlife"
version = "0.1.0"
description = "A personal wildlife sighting journal for Windows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.12,<6.13",   # Qt 6.12 LTS: widgets, web engine (map/charts), positioning
    "Pillow>=11",            # image reading, EXIF, thumbnails
    "pi-heif>=1.4",          # read iPhone HEIC photos (decode-only)
]

[project.gui-scripts]
wildlife = "wildlife.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildlife"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["spikes", "prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter manages line length; long text strings (messages, SVG paths) are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
markers = ["slow: takes more than a few seconds (installs the full species list)"]
qt_api = "pyside6"
