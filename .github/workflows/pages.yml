# Publishing the website (docs/17-website-plan.md).
#
# Pushing to main a change under site/ checks the site (tests/unit/test_site.py) and
# publishes the site/ folder to GitHub Pages at https://nevermore1983.github.io/Thicket/.
# If the check fails, the live site stays as it was. "Run workflow" on the Actions page
# publishes it again by hand.
#
# Outside code is pinned to exact versions (actions by commit), as in release.yml.

name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "tests/unit/test_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push waits rather than cutting one short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04 # a fixed version, so an update can't change the run
    timeout-minutes: 10
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the site (links, alt text, nothing loaded from elsewhere, changelog up to date)
        # The site test needs only pytest (at uv.lock's version), not the app, so this
        # skips the app's setup
        run: uv run --no-project --with pytest==9.1.1 pytest --noconftest -p no:cacheprovider tests/unit/test_site.py

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package the site folder
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # a fixed version, so an update can't change the run
    timeout-minutes: 10
    permissions:
      pages: write # to publish
      id-token: write # to prove to Pages that this run is allowed to
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
