<title>WildLife App Prototype</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable design prototype of the WildLife desktop app. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout concept: a calm desktop app shell. Left sidebar, top bar with global search + Add,
   scrolling page, and a right-hand side panel that pushes the page instead of covering it.
   Neutrals lean slightly green (the app's world is outdoors); one green accent for actions;
   data colours come from the validated categorical palette, never from the accent. */
:root {
  /* type */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-sci: "Source Serif 4", "Iowan Old Style", Georgia, serif;   /* scientific names, field-guide style */
  /* spacing & shape */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sidebar-w: 228px; --panel-w: 440px;
  /* neutrals (light) */
  --bg: #f3f5f1; --surface: #ffffff; --surface-2: #f0f2ed; --surface-3: #e5e9e2;
  --border: #dfe3dc; --border-strong: #c7cec4;
  --text: #17201a; --text-2: #556058; --text-3: #687069;
  /* accent: actions, selection, focus */
  --accent: #2e7d4f; --accent-hover: #256a42; --accent-fg: #ffffff;
  --accent-subtle: #e2f0e7; --accent-subtle-text: #1d5a37;
  /* semantic */
  --danger: #c4372c; --danger-subtle: #fbe8e6; --warning: #8f5b00; --warning-subtle: #fbf1d9;
  --good-text: #1e6b2c; --good-subtle: #e4f3e6;
  /* categorical (validated order, light) + ink for icons on each */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948; --c0: #7d847e;
  --ci1: #ffffff; --ci2: #ffffff; --ci3: #0b2a1f; --ci4: #2b1d00; --ci5: #3a0d1f; --ci6: #ffffff; --ci7: #ffffff; --ci8: #ffffff; --ci0: #ffffff;
  /* sequential (blue), low -> high */
  --q0: #eef1ec; --q1: #cde2fb; --q2: #9ec5f4; --q3: #6da7ec; --q4: #3987e5; --q5: #256abf; --q6: #184f95;
  --q-ink-lo: #10203a; --q-ink-hi: #ffffff;
  /* charts & map */
  --grid-line: #e6e9e3; --axis: #c7cec4;
  --map-water: #dde9ee; --map-land: #f7f8f4; --map-coast: #b9c4bc; --map-place: rgba(46,125,79,.14);
  /* depth */
  --shadow-sm: 0 1px 2px rgba(23,32,26,.06);
  --shadow: 0 2px 6px rgba(23,32,26,.06), 0 8px 24px rgba(23,32,26,.08);
  --shadow-lg: 0 12px 40px rgba(23,32,26,.18);
  --overlay: rgba(14,20,16,.38);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1210; --surface: #181c19; --surface-2: #1f2420; --surface-3: #282e29;
    --border: #2b322d; --border-strong: #3b443d;
    --text: #e6ebe6; --text-2: #a9b3aa; --text-3: #8d978e;
    --accent: #5fbf85; --accent-hover: #78cc99; --accent-fg: #0d1a12;
    --accent-subtle: #1b3125; --accent-subtle-text: #9edcb5;
    --danger: #ef7166; --danger-subtle: #3a1d1a; --warning: #e3a73f; --warning-subtle: #33290f;
    --good-text: #6fd08a; --good-subtle: #18301e;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #7a847b;
    --ci3: #ffffff; --ci4: #ffffff; --ci5: #ffffff; --ci7: #120d33;
    --q0: #1f2420; --q1: #183256; --q2: #184f95; --q3: #1c5cab; --q4: #2a78d6; --q5: #5598e7; --q6: #9ec5f4;
    --q-ink-lo: #e6ebe6; --q-ink-hi: #0b1a33;
    --grid-line: #262c27; --axis: #3b443d;
    --map-water: #121c21; --map-land: #1d221e; --map-coast: #3a4a40; --map-place: rgba(95,191,133,.16);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow: 0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
    --overlay: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1210; --surface: #181c19; --surface-2: #1f2420; --surface-3: #282e29;
  --border: #2b322d; --border-strong: #3b443d;
  --text: #e6ebe6; --text-2: #a9b3aa; --text-3: #8d978e;
  --accent: #5fbf85; --accent-hover: #78cc99; --accent-fg: #0d1a12;
  --accent-subtle: #1b3125; --accent-subtle-text: #9edcb5;
  --danger: #ef7166; --danger-subtle: #3a1d1a; --warning: #e3a73f; --warning-subtle: #33290f;
  --good-text: #6fd08a; --good-subtle: #18301e;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #7a847b;
  --ci3: #ffffff; --ci4: #ffffff; --ci5: #ffffff; --ci7: #120d33;
  --q0: #1f2420; --q1: #183256; --q2: #184f95; --q3: #1c5cab; --q4: #2a78d6; --q5: #5598e7; --q6: #9ec5f4;
  --q-ink-lo: #e6ebe6; --q-ink-hi: #0b1a33;
  --grid-line: #262c27; --axis: #3b443d;
  --map-water: #121c21; --map-land: #1d221e; --map-coast: #3a4a40; --map-place: rgba(95,191,133,.16);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow: 0 2px 6px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  --overlay: rgba(0,0,0,.55);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
table { font: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ic { flex: none; display: block; }
.sci { font-family: var(--font-sci); font-style: italic; color: var(--text-2); font-size: .97em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; padding: var(--s3) var(--s2); overflow-y: auto; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.brand-name { font: 650 16px/1.1 var(--font-display); letter-spacing: -.01em; }
.brand-sub { font-size: 11.5px; color: var(--text-3); }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; color: var(--text-2); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; min-height: 38px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-subtle); color: var(--accent-subtle-text); font-weight: 600; }
.nav-item .nav-count { margin-left: auto; font-size: 11.5px; font-weight: 600; background: var(--surface-3); color: var(--text-2); border-radius: 999px; padding: 1px 7px; }
.nav-spacer { flex: 1; min-height: 16px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; transition: margin-right .22s ease; }
.topbar { display: flex; align-items: center; gap: var(--s3); padding: 10px var(--s5); border-bottom: 1px solid var(--border); background: var(--surface); min-height: 60px; }
.search { position: relative; flex: 1; max-width: 560px; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); padding: 0 64px 0 38px; }
.search input:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-subtle); }
.search .ic-search { position: absolute; left: 11px; top: 10px; color: var(--text-3); pointer-events: none; }
.search kbd { position: absolute; right: 9px; top: 9px; }
.topbar-right { display: flex; align-items: center; gap: var(--s2); margin-left: auto; }
.outing-chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--accent-subtle); color: var(--accent-subtle-text); font-size: 12.5px; font-weight: 600; border: 0; cursor: pointer; white-space: nowrap; }
.outing-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.content { flex: 1; overflow: auto; padding: var(--s5) 28px 96px; min-width: 0; }
.content.flush { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: 20px; flex-wrap: wrap; }
.page-title { font: 600 24px/1.2 var(--font-display); margin: 0; letter-spacing: -.012em; text-wrap: balance; }
.subtitle { color: var(--text-2); margin-top: 4px; }
.head-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
kbd { font: 600 11px/1 var(--font-ui); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; color: var(--text-2); background: var(--surface); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 550; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-subtle); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.bordered { border-color: var(--border-strong); background: var(--surface); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 28px; border-radius: 6px; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 550; font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: var(--s4); overflow-x: auto; overflow-y: hidden; }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .pill { font-size: 11.5px; background: var(--surface-3); border-radius: 999px; padding: 0 7px; color: var(--text-2); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.input, select.input, textarea.input { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); padding: 0 10px; }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
.field.invalid .input { border-color: var(--danger); }
.help { font-size: 12.5px; color: var(--text-3); }
.error-text { font-size: 12.5px; color: var(--danger); display: flex; gap: 6px; align-items: flex-start; }
.ok-text { font-size: 12.5px; color: var(--good-text); display: flex; gap: 6px; align-items: center; }
.row { display: flex; gap: var(--s3); }
.row > * { flex: 1; min-width: 0; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); top: 2px; left: 2px; box-shadow: var(--shadow-sm); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- cards, tiles ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--s4) 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.card-title { font: 600 14.5px/1.3 var(--font-ui); margin: 0; }
.card-caption { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.link-btn:hover { background: var(--accent-subtle); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 18px 16px; min-width: 0; }
.tile-label { font-size: 12.5px; color: var(--text-2); font-weight: 550; }
.tile-value { font: 600 30px/1.15 var(--font-display); letter-spacing: -.02em; margin-top: 6px; }
.tile-delta { font-size: 12.5px; margin-top: 4px; color: var(--text-3); display: flex; gap: 4px; align-items: center; }
.tile-delta.up { color: var(--good-text); }
.dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: 1 / -1; }

/* ---------- lists ---------- */
.s-list { display: flex; flex-direction: column; }
.s-row { display: flex; align-items: center; gap: var(--s3); padding: 8px 6px; border-radius: 9px; cursor: pointer; min-width: 0; border: 0; background: none; text-align: left; width: 100%; }
.s-row:hover { background: var(--surface-2); }
.s-row + .s-row { border-top: 1px solid var(--border); border-radius: 0; }
.s-row:hover + .s-row { border-top-color: transparent; }
.s-main { min-width: 0; flex: 1; }
.s-title, .s-meta { display: block; }
.s-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-side { font-size: 12.5px; color: var(--text-3); text-align: right; white-space: nowrap; }
.thumb { display: block; width: 44px; height: 44px; border-radius: 9px; flex: none; position: relative; overflow: hidden; }
.thumb.sm { width: 34px; height: 34px; border-radius: 7px; }
.thumb.no-photo { background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); border: 1px dashed var(--border-strong); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.badge.lifer { background: var(--accent-subtle); color: var(--accent-subtle-text); }
.badge.foy { background: var(--surface-3); color: var(--text-2); }
.badge.warn { background: var(--warning-subtle); color: var(--warning); }
.cat-swatch { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.cat-swatch.sm { width: 18px; height: 18px; }
.cat-label { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* ---------- tables ---------- */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; z-index: 1; }
table.data th.sortable { cursor: pointer; }
table.data th.sortable:hover { color: var(--text); }
table.data td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tbody tr.selected { background: var(--accent-subtle); }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; }
table.data .chk { width: 36px; padding-right: 0; }
table.data input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.sp-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sp-cell .sci { font-size: 12.5px; }
.table-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: 10px 4px 0; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }

/* ---------- filter bar ---------- */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
.fchip:hover { background: var(--surface-2); }
.fchip.active { background: var(--accent-subtle); border-color: transparent; color: var(--accent-subtle-text); font-weight: 600; }
.fchip .x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; margin-right: -4px; }
.fchip .x:hover { background: rgba(0,0,0,.08); }
.bulkbar { display: flex; align-items: center; gap: var(--s2); padding: 8px 10px 8px 14px; border-radius: var(--r-md); background: var(--text); color: var(--surface); margin-bottom: var(--s3); flex-wrap: wrap; }
.bulkbar .btn { background: transparent; color: var(--surface); border-color: rgba(127,127,127,.5); }
.bulkbar .btn:hover { background: rgba(127,127,127,.25); }
.bulkbar strong { margin-right: auto; }

/* ---------- popover, menus ---------- */
.popover { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 6px; min-width: 220px; max-width: min(340px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; text-align: left; color: var(--text); }
.menu-item:hover, .menu-item.hl { background: var(--surface-2); }
.menu-item .chk-ic { margin-left: auto; color: var(--accent); }
.menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.menu-label { font-size: 11.5px; font-weight: 650; color: var(--text-3); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- side panel ---------- */

// ---------------------------------------------------------------- generate sample library
const DATA = (() => {
  const sightings = [], outings = [], photos = [];
  let sid = 1, pid = 1;
  const jitter = (p, m) => { const d = m / 111320; return [p.lat + (R() - .5) * 2 * d, p.lon + ((R() - .5) * 2 * d) / Math.cos(rad(p.lat))]; };
  const addPhotos = (s, n) => { for (let i = 0; i < n; i++) { photos.push({ id: pid, sightings: [s.id], seed: pid * 7919, taken: `${s.date} ${s.time || '12:00'}`, cat: spById[s.sp].cat, missing: pid === 23 }); s.photos.push(pid++); } };
  function make(spId, date, time, place, outing) {
    const sp = spById[spId], loc = R(), s = { id: sid++, sp: spId, date, time, place: place?.id ?? null, lat: null, lon: null, unc: null, how: 'place', count: 1, cq: 'exact', evidence: 'seen', idc: 'certain', notes: null, outing, photos: [], notWild: false, deleted: false };
    if (place && loc < .55) { [s.lat, s.lon] = jitter(place, Math.min(place.r, 400)); s.unc = pick([10, 10, 100]); s.how = pick(['map', 'photo', 'grid_ref']); }
    s.count = sp.cat === 1 && R() < .3 ? pick([2, 3, 4, 6, 12, 25, 40]) : R() < .25 ? pick([2, 3]) : 1;
    if (s.count >= 25) s.cq = 'approx';
    s.evidence = sp.cat === 1 && R() < .14 ? pick(['heard', 'seen_heard']) : (sp.cat === 4 && R() < .2) ? 'trapped' : R() < .03 ? 'signs' : 'seen';
    s.idc = R() < .05 ? pick(['probable', 'possible']) : 'certain';
    if (R() < .32) s.notes = pick(NOTES);
    if (R() < .26) addPhotos(s, rint(1, 3));
    sightings.push(s); return s;
  }
  // outings
  const wild = PLACES.filter((p) => p.id !== 1);
  for (let i = 0; i < 92; i++) {
    let day = addDays('2024-01-06', rint(0, ms(TODAY) / 864e5 - ms('2024-01-06') / 864e5 - 2));
    if (R() < .7) { const w = dow(day); day = addDays(day, w === 0 || w === 6 ? 0 : 6 - w); }
    if (day >= TODAY) day = addDays(TODAY, -2);
    const place = wpick(wild, (p) => [0, 0, 8, 5, 5, 6, 4, 5, 3, 2, 1.5, 1.5, 3, 1, 2, 1][p.id]);
    const start = rint(7, 11), o = { id: i + 1, date: day, start: `${String(start).padStart(2, '0')}:${pick(['00', '15', '30', '45'])}`, place: place.id, weather: pick(['Sunny', 'Partly cloudy', 'Overcast', 'Overcast', 'Drizzle']), temp: rint(4, 22), complete: R() < .4 };
    outings.push(o);
    const m = ymd(day)[1], pool = SP.filter((s) => inSeason(s, m) && (!s.at || s.at.includes(place.id)) && !(s.at === null && s.garden && R() < .2));
    const seen = new Set(), k = rint(6, 20); let t = start * 60 + rint(0, 30);
    for (let j = 0; j < k; j++) {
      const sp = wpick(pool, (s) => (seen.has(s.id) ? 0 : s.w * (s.at ? 6 : 1)));
      if (!sp || seen.has(sp.id)) continue; seen.add(sp.id); t += rint(3, 22);
      make(sp.id, day, `${String(Math.min(23, Math.floor(t / 60))).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`, place, o.id);
    }
  }
  // garden & casual records
  const garden = SP.filter((s) => s.garden);
  for (let i = 0; i < 300; i++) {
    const day = addDays(TODAY, -rint(1, ms(TODAY) / 864e5 - ms('2024-01-01') / 864e5)), m = ymd(day)[1];
    const sp = wpick(garden, (s) => (inSeason(s, m) ? s.w : 0));
    const time = R() < .85 ? `${String(rint(6, 20)).padStart(2, '0')}:${String(rint(0, 59)).padStart(2, '0')}` : null;
    const s = make(sp.id, day, time, R() < .93 ? placeById[1] : null, null);
    if (!s.place && R() < .5) { s.lat = 51.70 + R() * .1; s.lon = -0.4 + R() * .15; s.unc = 100; s.how = 'typed'; }
  }
  // this morning in the garden
  const g = placeById[1];
  [[1, '07:52', 1], [3, '08:05', 2], [5, '08:30', 3]].forEach(([spId, time, count]) => { const s = make(spId, TODAY, time, g, 'current'); s.count = count; s.idc = 'certain'; s.notWild = false; });
  sightings.find((s) => s.date === TODAY && s.sp === 5).notes = 'Three on the nyjer feeder';
  // inbox: photos imported yesterday, not attached yet
  const inbox = [];
  const yday = addDays(TODAY, -1), groups = [[3, '10:42', 2, 5], [5, '11:18', 2, 4], [3, '14:05', 4, 3], [4, '15:30', 2, 2]];
  groups.forEach(([cat, time, place, n], gi) => { for (let i = 0; i < n; i++) { const mins = Number(time.slice(3)) + i * 2; inbox.push({ id: pid++, sightings: [], seed: (pid + 31) * 104729, taken: `${yday} ${time.slice(0, 3)}${String(Math.min(59, mins)).padStart(2, '0')}`, cat: [1, 2, 4, 5][gi], place, group: gi, gps: true }); } });
  photos.push(...inbox);
  // a sighting with 'Not wild' and a recycled one, for realism
  sightings[40].notWild = true; sightings[41].deleted = true;
  return { sightings, outings, photos };
})();

let _derived = null;
function derived() {
  if (_derived && _derived.v === state.version && _derived.e === state.empty) return _derived;
  const all = live().slice().sort(sortChrono), first = new Map(), foy = new Map(), uses = new Map(), last = new Map();
  for (const s of all) {
    uses.set(s.sp, (uses.get(s.sp) || 0) + 1); last.set(s.sp, s);
    if (!countable(s)) continue;
    if (!first.has(s.sp)) first.set(s.sp, s);
    const key = s.sp + '|' + s.date.slice(0, 4); if (!foy.has(key)) foy.set(key, s);
  }
  _derived = { v: state.version, e: state.empty, all, first, foy, uses, last };
  return _derived;
}
const isLifer = (s) => derived().first.get(s.sp) === s;
const isFoy = (s) => derived().foy.get(s.sp + '|' + s.date.slice(0, 4)) === s;
const bump = () => { state.version++; };

function applyFilter(list, f = state.filter) {
  const q = f.q.trim().toLowerCase();
  return list.filter((s) => {
    if (f.cats.size && !f.cats.has(sp(s).cat)) return false;
    if (f.from && s.date < f.from) return false;
    if (f.to && s.date > f.to) return false;
    if (f.place && s.place !== f.place) return false;
    if (f.sp && s.sp !== f.sp) return false;
    if (q) { const x = sp(s); const hay = `${x.common} ${x.sci} ${s.place ? placeById[s.place].name : ''} ${s.notes || ''}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
const filterActive = () => state.filter.cats.size || state.filter.from || state.filter.to || state.filter.place || state.filter.sp || state.filter.q;

function weekStart(iso) { return addDays(iso, -((dow(iso) + 6) % 7)); }

function closePanel() { state.panelStack = []; drawPanel(); }
function drawPanel() {
  const p = $('#panel'), view = state.panelStack.at(-1);

  p.classList.toggle('open', !!view); p.setAttribute('aria-hidden', String(!view));
  if (!view) { setTimeout(() => { if (!state.panelStack.length) p.innerHTML = ''; }, 250); if (state.page === 'map') setTimeout(drawMap, 240); return; }
  const back = state.panelStack.length > 1 ? `<button class="icon-btn back-btn" data-action="panel-back" aria-label="Back">${icon('chevL')}</button>` : '';

}

  if (mi >= 0 && ym) html += `<div class="menu-label">Dates</div><button class="menu-item" data-action="cal-goto-month-search" data-id="${isoYMD(+ym[1], mi + 1, 1)}">${icon('calendar', 16)}<span>${MONTH[mi]} ${ym[1]} in the calendar</span></button>`;
  html += `<div class="menu-sep"></div><button class="menu-item" data-action="search-all">${icon('search', 16)}<span>All sightings matching “${esc(gs.value.trim())}”</span><span class="chk-ic"><kbd>Enter</kbd></span></button>`;

}

// ---------- keyboard ----------
document.addEventListener('keydown', (e) => {
  if ($('.viewer')) return;
  if ($('#modalRoot').innerHTML && e.key === 'Escape') { closeModal(); return; }
  const inField = e.target.closest('input, textarea, select, [contenteditable]');
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'n') { e.preventDefault(); ACTIONS.add(); return; }
  if (ctrl && e.key.toLowerCase() === 'k') { e.preventDefault(); gs.focus(); gs.select(); return; }
  if (ctrl && /^[1-8]$/.test(e.key)) { e.preventDefault(); ACTIONS.nav(NAV[+e.key - 1][0]); return; }
  if (ctrl && e.key.toLowerCase() === 'z' && !inField && state.lastUndo) { e.preventDefault(); const u = state.lastUndo; state.lastUndo = null; u(); toast('Undone'); return; }
  const view = state.panelStack.at(-1);
  if (view?.type === 'edit') {
    if (e.target.id === 'fSpecies' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
      const items = $$('#spList .menu-item'); if (!items.length) return; e.preventDefault();
      if (e.key === 'Enter') { items[Math.min(form.hl, items.length - 1)].click(); return; }
      form.hl = Math.max(0, Math.min(items.length - 1, form.hl + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach((it, i) => it.classList.toggle('hl', i === form.hl)); return;
    }
    if (ctrl && e.key === 'Enter') { e.preventDefault(); saveForm(!form.id); return; }
    if ((ctrl && e.key.toLowerCase() === 's') || (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file')) { e.preventDefault(); saveForm(false); return; }
  }
  if (e.key === 'Escape') { if (!$('#popover').hidden) { hideMenu(); return; } if (state.panelStack.length) { closePanel(); return; } }
  if (inField) return;
  if (e.key === '?') { shortcutsModal(); return; }
  if (view?.type === 'sighting' && (e.key === 'Delete')) { ACTIONS['delete-s'](view.id); return; }
  if (view?.type === 'sighting' && e.key.toLowerCase() === 'e') { ACTIONS['edit-s'](view.id); return; }
  if (state.page === 'calendar' && !ctrl) {
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowLeft') calMove(-1); else if (e.key === 'ArrowRight') calMove(1); else if (k === 't') ACTIONS['cal-today']();
    else if ('ymwd'.includes(k) && k.length === 1) ACTIONS['cal-view']({ y: 'year', m: 'month', w: 'week', d: 'day' }[k]);
    else if (k === 'n') ACTIONS['add-on'](state.cal.date);
  }
});
